databaseChangeLog:
  - changeSet:
      id: 1-create-table-outbox
      author: max zinoviev
      changes:
        - createTable:
            tableName: outbox
            columns:
              - column:
                  name: message_id
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_outbox
              - column:
                  name: topic_name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
