databaseChangeLog:
  - changeSet:
      id: 1-create-table-inbox
      author: max zinoviev
      changes:
        - createTable:
            tableName: inbox
            columns:
              - column:
                  name: message_key
                  type: UUID
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inbox
              - column:
                  name: status
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamp
                  constraints:
                    nullable: true